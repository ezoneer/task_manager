<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Бэкенд Тренажер</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; line-height: 1.6; }
        .card { border: 1px solid #ccc; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { display: block; width: 100%; margin-bottom: 10px; padding: 8px; }
        button { cursor: pointer; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; }
        #status { font-weight: bold; color: green; }
    </style>
</head>
<body>

<div class="card">
    <h3>Авторизация</h3>
    <input id="email" type="email" placeholder="Email" value="test@test.com">
    <input id="password" type="password" placeholder="Пароль" value="password123">
    <button onclick="auth('register')">Регистрация</button>
    <button onclick="auth('login')">Войти</button>
    <button onclick="logout()" style="background: #dc3545;">Выйти</button>
</div>

<div class="card">
    <h3>Данные пользователя</h3>
    <button onclick="getMe()">Кто я?</button>
    <p id="user-info">Нажми кнопку, чтобы проверить доступ</p>
</div>

<p id="status"></p>

<script>
    const BASE_URL = 'http://localhost:8080';

    async function auth(type) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const url = `${BASE_URL}/auth/${type}`;

        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
                credentials: 'include'
            });

            const data = await response.json();
            document.getElementById('status').innerText = response.ok ? `Успех: ${type}` : `Ошибка: ${data.detail || 'Неизвестно'}`;

            if (response.ok && type === 'login') {
                console.log('Залогинились! Браузер должен был сохранить куки.');
            }
        } catch (e) {
            console.error(e);
            alert('Бэкенд не отвечает. Проверь CORS и запущен ли сервер!');
        }
    }

    async function getMe() {
        try {
            const response = await fetch(`${BASE_URL}/auth/me`, { method: 'GET', credentials: 'include' });
            const data = await response.json();

            if (response.ok) {
                document.getElementById('user-info').innerText = `ID: ${data.id}, Email: ${data.email}`;
            } else {
                document.getElementById('user-info').innerText = `Доступ запрещен (надо залогиниться)`;
            }
        } catch (e) {
            alert('Ошибка запроса данных');
        }
    }

    async function logout() {
        try {
            const response = await fetch(`${BASE_URL}/auth/logout`, {
                method: 'POST',
                credentials: 'include'
            });

            if (response.ok) {
                alert("Сессия очищена!");
                // Исправлено: ID должен быть 'user-info'
                document.getElementById('user-info').innerText = 'Нажми кнопку, чтобы проверить доступ';
                document.getElementById('status').innerText = 'Вы вышли из системы';
            } else {
                alert("Ошибка при выходе");
            }
        } catch (e) {
            alert("Сервер не отвечает");
        }
    }

</script>

</body>
</html>
